<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Francesca Simone — Inhalte bearbeiten</title>
    <!-- Never indexed / never linked from public nav (Constitution III / FR-014). -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <!--
      Decap CMS mounts itself into the body. The version is pinned rather than using a `^3.0.0`
      range: this script is fetched fresh by the browser on every visit, so a range would silently
      roll Francesca's editor forward onto any future 3.x release the moment it is published.
    -->
    <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>

    <!--
      FR-018: draft preview, rendered in-app rather than via a deploy-preview URL. GitHub Pages
      has no per-branch preview deployments (unlike Netlify/Vercel/Cloudflare Pages), so instead
      of linking out to a live URL, this registers a preview template that renders each entry's
      fields directly inside the admin screen, styled to loosely match the real site (research.md
      §2/§5). It won't be pixel-identical to the published page, but gives Francesca a clear,
      readable sense of what she's about to publish before she does.
    -->
    <script>
      var GenericPreview = createClass({
        render: function () {
          var data = this.props.entry.get("data");
          var getAsset = this.props.getAsset;
          var children = [];

          var heading = data.get("title") || data.get("name") || data.get("venueName");
          if (heading) {
            children.push(h("h1", { key: "heading" }, heading));
          }

          ["tagline", "subtitle", "intro"].forEach(function (field) {
            var value = data.get(field);
            if (value) {
              children.push(h("p", { key: field, className: "tagline" }, value));
            }
          });

          if (data.get("programName")) {
            children.push(
              h("p", { key: "programName" }, "Aktuelles Programm: " + data.get("programName")),
            );
          }

          // 002: quote + attribution render together, never separately.
          var quote = data.get("quote") || data.get("pullQuote");
          if (quote) {
            var attribution = data.get("quoteAttribution");
            children.push(
              h(
                "blockquote",
                { key: "quote" },
                "„" + quote + "“" + (attribution ? " — " + attribution : ""),
              ),
            );
          }

          ["portrait", "portraitVita", "photo", "coverImage", "heroImage"].forEach(
            function (field) {
              var image = data.get(field);
              if (image) {
                children.push(
                  h("img", {
                    key: field,
                    src: getAsset(image).toString(),
                    alt: data.get(field + "Alt") || "",
                  }),
                );
              }
            },
          );

          if (data.get("date")) {
            children.push(h("p", { key: "date" }, String(data.get("date"))));
            children.push(
              h(
                "p",
                { key: "venue" },
                [data.get("venueName"), data.get("location")].filter(Boolean).join(" · "),
              ),
            );
          }
          if (data.get("eventLink")) {
            children.push(h("p", { key: "eventLink" }, data.get("eventLink")));
          }
          if (data.get("notes")) {
            children.push(h("p", { key: "notes" }, data.get("notes")));
          }

          if (data.get("locations")) {
            children.push(
              h(
                "ul",
                { key: "locations" },
                data
                  .get("locations")
                  .toJS()
                  .map(function (location, index) {
                    return h("li", { key: index }, location);
                  }),
              ),
            );
          }

          if (data.get("email")) {
            children.push(h("p", { key: "email" }, data.get("email")));
          }
          if (data.get("phone")) {
            children.push(h("p", { key: "phone" }, "Telefon: " + data.get("phone")));
          }
          if (data.get("phoneMobile")) {
            children.push(h("p", { key: "phoneMobile" }, "Mobil: " + data.get("phoneMobile")));
          }
          if (data.get("location") && !data.get("venueName")) {
            children.push(h("p", { key: "location" }, data.get("location")));
          }
          if (data.get("ensemble")) {
            children.push(h("p", { key: "ensemble" }, data.get("ensemble")));
          }

          // 002: teaching structure (offerings list + methods/education/scheduling texts).
          var offerings = data.get("offerings");
          if (offerings && offerings.size) {
            children.push(
              h(
                "ul",
                { key: "offerings" },
                offerings.toJS().map(function (offering, index) {
                  return h("li", { key: index }, offering);
                }),
              ),
            );
          }
          [
            ["methodsHeading", "methodsText"],
            ["educationHeading", "educationText"],
          ].forEach(function (pair) {
            var heading = data.get(pair[0]);
            var text = data.get(pair[1]);
            if (heading || text) {
              children.push(h("h2", { key: pair[0] }, heading || ""));
              children.push(h("p", { key: pair[1] }, text || ""));
            }
          });
          if (data.get("schedulingText")) {
            children.push(h("p", { key: "schedulingText" }, data.get("schedulingText")));
          }

          // 002: band line-up (programs `lineup`, projects `members`).
          ["lineup", "members"].forEach(function (field) {
            var list = data.get(field);
            if (!list || !list.size) return;
            children.push(
              h(
                "ul",
                { key: field },
                list.toJS().map(function (member, index) {
                  return h("li", { key: index }, (member.role || "") + ": " + (member.name || ""));
                }),
              ),
            );
          });

          // 002: attached documents (flyers list, single flyer object, CD info sheet).
          var flyers = data.get("flyers");
          if (flyers && flyers.size) {
            children.push(
              h(
                "ul",
                { key: "flyers" },
                flyers.toJS().map(function (flyer, index) {
                  return h("li", { key: index }, "📄 " + (flyer.label || flyer.file || ""));
                }),
              ),
            );
          }
          var flyer = data.get("flyer");
          if (flyer && flyer.get && (flyer.get("label") || flyer.get("file"))) {
            children.push(
              h("p", { key: "flyer" }, "📄 " + (flyer.get("label") || flyer.get("file"))),
            );
          }
          if (data.get("infoPdf")) {
            children.push(h("p", { key: "infoPdf" }, "📄 Info-PDF: " + data.get("infoPdf")));
          }
          if (data.get("audioSample")) {
            children.push(
              h("p", { key: "audioSample" }, "🎵 Hörprobe: " + data.get("audioSample")),
            );
          }

          if (data.get("pitchHeading") || data.get("pitchText")) {
            children.push(h("h2", { key: "pitchHeading" }, data.get("pitchHeading") || ""));
            children.push(h("p", { key: "pitchText" }, data.get("pitchText") || ""));
          }

          if (data.get("teaser")) {
            children.push(
              h("p", { key: "teaser", className: "meta" }, "Startseite: " + data.get("teaser")),
            );
          }

          ["links", "socialLinks"].forEach(function (field) {
            var list = data.get(field);
            if (!list || !list.size) return;
            children.push(
              h(
                "ul",
                { key: field },
                list.toJS().map(function (link, index) {
                  return h("li", { key: index }, (link.label || "") + " — " + (link.url || ""));
                }),
              ),
            );
          });

          if (data.get("releaseYear")) {
            children.push(h("p", { key: "releaseYear" }, String(data.get("releaseYear"))));
          }

          if (data.get("lastUpdated")) {
            children.push(
              h(
                "p",
                { key: "lastUpdated", className: "meta" },
                "Zuletzt aktualisiert: " + String(data.get("lastUpdated")),
              ),
            );
          }

          // widgetFor() looks the name up in the collection's own field list and dereferences the
          // result without a guard, so asking for a field a collection doesn't have (Termine has
          // no markdown body) throws and takes the whole preview pane down with it.
          var fields = this.props.fields;
          var hasBody =
            fields &&
            fields.some(function (field) {
              return field.get("name") === "body";
            });
          if (hasBody) {
            children.push(
              h("div", { key: "body", className: "body" }, this.props.widgetFor("body")),
            );
          }

          return h("div", { className: "preview" }, children);
        },
      });

      [
        "biography",
        "projects",
        "programs",
        "tour_dates",
        "discography",
        "teaching",
        "contact",
        "legal",
      ].forEach(function (collectionName) {
        CMS.registerPreviewTemplate(collectionName, GenericPreview);
      });

      // System font stacks only — no Google Fonts request, consistent with the public site's
      // self-hosted fonts (002 research.md §2). The preview approximates, it doesn't replicate.
      CMS.registerPreviewStyle(
        [
          "body { font-family: 'Hanken Grotesk', system-ui, sans-serif; color: oklch(22% 0.02 50); background: oklch(97% 0.012 60); padding: 2rem; }",
          "h1, h2 { font-family: 'Bodoni Moda', Didot, 'Times New Roman', serif; font-weight: 500; margin: 1rem 0 0.5rem; }",
          "h1 { font-size: 2rem; margin-top: 0; }",
          "blockquote { font-family: 'Bodoni Moda', Didot, 'Times New Roman', serif; font-style: italic; font-size: 1.15rem; margin: 1rem 0; }",
          ".tagline { font-family: 'Bodoni Moda', Didot, 'Times New Roman', serif; font-style: italic; font-size: 1.25rem; margin: 0 0 1rem; }",
          "img { max-width: 20rem; border-radius: 0.25rem; margin: 0.5rem 0; }",
          ".meta { color: oklch(45% 0.02 50); font-size: 0.875rem; }",
          ".body { margin-top: 1rem; line-height: 1.6; }",
        ].join("\n"),
        { raw: true },
      );
    </script>
  </body>
</html>
