# Decap CMS: Laurin Wünsch personal site (see docs/cms-auth-setup.md for git-gateway setup).

backend:
  name: git-gateway
  repo: Laur1n/LandingPage
  branch: main
  identity_url: https://auth.decapbridge.com/sites/e380cd0b-df6a-4278-963b-8eb57fc3bab9
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}>
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}>
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}>

site_url: https://laur1n.github.io/LandingPage

publish_mode: editorial_workflow

media_folder: "public/uploads"
public_folder: "/uploads"

locale: "de"

collections:
  - name: "site"
    label: "Website-Texte"
    editor:
      preview: false
    files:
      - name: "site"
        label: "Website-Texte"
        file: "src/content/site/de/index.md"
        fields:
          - { label: "Sprache", name: "lang", widget: "hidden", default: "de" }
          - { label: "Seitentitel (Browser & Google)", name: "seoTitle", widget: "string" }
          - { label: "Seitenbeschreibung (Google)", name: "seoDescription", widget: "text" }
          - { label: "Name oben links", name: "brand", widget: "string" }
          - { label: "Sprunglink (Barrierefreiheit)", name: "skipLinkLabel", widget: "string" }
          - label: "Menü"
            name: "nav"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Start", name: "start", widget: "string" }
              - { label: "Cue Pilot", name: "cuePilot", widget: "string" }
              - { label: "Sportlehrer", name: "sportlehrer", widget: "string" }
              - { label: "Aufgussmeister", name: "aufgussmeister", widget: "string" }
              - { label: "Über mich", name: "ueberMich", widget: "string" }
              - { label: "Kontakt", name: "kontakt", widget: "string" }
          - label: "Startbereich"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Begrüßung", name: "welcome", widget: "string" }
              - { label: "Überschrift", name: "name", widget: "string" }
              - { label: "Einleitungstext", name: "intro", widget: "text" }
              - { label: "Rollen / Kurzbeschreibung", name: "role", widget: "string" }
              - { label: "Button 1", name: "primaryCtaLabel", widget: "string" }
              - { label: "Button 2", name: "secondaryCtaLabel", widget: "string" }
              - { label: "Foto", name: "image", widget: "image" }
              - { label: "Alt-Text Foto", name: "imageAlt", widget: "string" }
          - label: "Abschnitts-Überschriften (Startseite)"
            name: "sections"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Bereiche: Kleintitel", name: "offeringsEyebrow", widget: "string" }
              - { label: "Bereiche: Überschrift", name: "offeringsHeading", widget: "string" }
              - { label: "Über mich: Kleintitel", name: "aboutEyebrow", widget: "string" }
              - { label: "Über mich: Überschrift", name: "aboutHeading", widget: "string" }
              - { label: "Kontakt: Kleintitel", name: "kontaktEyebrow", widget: "string" }
              - { label: "Kontakt: Überschrift", name: "kontaktHeading", widget: "string" }
          - label: "Impressum & Datenschutz"
            name: "legalPages"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Kleintitel", name: "eyebrow", widget: "string" }
              - { label: "„Zuletzt aktualisiert“", name: "updatedLabel", widget: "string" }
              - { label: "Impressum: Meta-Beschreibung", name: "impressumDescription", widget: "string" }
              - { label: "Datenschutz: Meta-Beschreibung", name: "datenschutzDescription", widget: "string" }
          - label: "Fußzeile"
            name: "footer"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Copyright-Name", name: "copyright", widget: "string" }
          - label: "Startseite: Link-Texte"
            name: "teasers"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Über mich", name: "aboutCtaLabel", widget: "string" }
              - { label: "Bereiche (optional)", name: "offeringsCtaLabel", widget: "string" }
              - { label: "Kontakt", name: "kontaktCtaLabel", widget: "string" }
          - label: "Unterseiten: Überschriften"
            name: "subpages"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Über mich: Kleintitel", name: "aboutEyebrow", widget: "string" }
              - { label: "Über mich: Überschrift", name: "aboutHeading", widget: "string" }
              - { label: "Kontakt: Kleintitel", name: "kontaktEyebrow", widget: "string" }
              - { label: "Kontakt: Überschrift", name: "kontaktHeading", widget: "string" }
          - label: "Bereichs-Seiten"
            name: "offering"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Button „Anfrage senden“", name: "contactCtaLabel", widget: "string" }
              - { label: "Button „E-Mail schreiben“", name: "emailCtaLabel", widget: "string" }
              - { label: "E-Mail-Betreff (Präfix)", name: "emailSubjectPrefix", widget: "string" }
              - { label: "Hinweis externe Links", name: "externalLinkHint", widget: "string" }
          - label: "Kontakt: Feldlabels"
            name: "contactLabels"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Telefon", name: "phone", widget: "string" }
              - { label: "Mobil", name: "mobile", widget: "string" }
              - { label: "E-Mail", name: "email", widget: "string" }
              - { label: "Ort", name: "location", widget: "string" }

  - name: "about"
    label: "Über mich"
    files:
      - name: "about"
        label: "Über mich"
        file: "src/content/about/de/index.md"
        fields:
          - { label: "Sprache", name: "lang", widget: "hidden", default: "de" }
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Tagline / Kurzprofil", name: "tagline", widget: "string" }
          - { label: "Porträt (Startseite)", name: "portrait", widget: "image" }
          - { label: "Alt-Text Porträt Start", name: "portraitAlt", widget: "string" }
          - { label: "Porträt (Unterseite, optional)", name: "portraitPage", widget: "image", required: false }
          - { label: "Alt-Text Porträt Unterseite", name: "portraitPageAlt", widget: "string", required: false }
          - { label: "Teaser (Startseite)", name: "teaser", widget: "text" }
          - { label: "Zitat (optional)", name: "pullQuote", widget: "text", required: false }
          - { label: "Vollständiger Text", name: "body", widget: "markdown" }

  - name: "offerings"
    label: "Bereiche"
    label_singular: "Bereich"
    folder: "src/content/offerings/de"
    create: true
    identifier_field: "title"
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["order", "title"]
    fields:
      - { label: "Sprache", name: "lang", widget: "hidden", default: "de" }
      - {
          label: "Titel",
          name: "title",
          widget: "string",
          hint: "URL wird daraus abgeleitet (z. B. cue-pilot). Reserviert: ueber-mich, kontakt, impressum, datenschutz, admin",
        }
      - { label: "Untertitel (optional)", name: "subtitle", widget: "string", required: false }
      - { label: "Einleitung (Hero)", name: "intro", widget: "text" }
      - { label: "Teaser (Startseite)", name: "teaser", widget: "text" }
      - { label: "Bild (optional)", name: "heroImage", widget: "image", required: false }
      - { label: "Alt-Text Bild", name: "heroImageAlt", widget: "string", required: false }
      - { label: "Reihenfolge", name: "order", widget: "number", required: false, value_type: "int" }
      - { label: "Link-Text „Mehr erfahren“", name: "ctaLabel", widget: "string", required: false }
      - { label: "Zitat (optional)", name: "quote", widget: "text", required: false }
      - { label: "Zitat: Quelle", name: "quoteAttribution", widget: "string", required: false }
      - { label: "Abschnitt: Überschrift (optional)", name: "pitchHeading", widget: "string", required: false }
      - { label: "Abschnitt: Text (optional)", name: "pitchText", widget: "text", required: false }
      - label: "Funktionen (optional, z. B. Cue Pilot)"
        name: "features"
        widget: "list"
        required: false
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
      - label: "Ablauf-Schritte (optional, z. B. Cue Pilot)"
        name: "workflow"
        widget: "list"
        required: false
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
      - label: "Links (optional)"
        name: "links"
        widget: "list"
        required: false
        fields:
          - { label: "Beschriftung", name: "label", widget: "string" }
          - {
              label: "URL",
              name: "url",
              widget: "string",
              pattern: ["^https?://.+|^/.+", "https://… oder /interner-pfad"],
            }
      - { label: "Haupttext", name: "body", widget: "markdown" }

  - name: "contact"
    label: "Kontakt"
    files:
      - name: "contact"
        label: "Kontakt"
        file: "src/content/contact/de/index.md"
        fields:
          - { label: "Sprache", name: "lang", widget: "hidden", default: "de" }
          - {
              label: "E-Mail",
              name: "email",
              widget: "string",
              pattern: ["^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", "Gültige E-Mail"],
            }
          - { label: "Telefon", name: "phone", widget: "string", required: false }
          - { label: "Mobil", name: "phoneMobile", widget: "string", required: false }
          - { label: "Ort", name: "location", widget: "string", required: false }
          - label: "Links (LinkedIn, App, …)"
            name: "socialLinks"
            widget: "list"
            required: false
            fields:
              - { label: "Beschriftung", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string", pattern: ["^https?://.+", "https://…"] }
          - { label: "Einleitungstext", name: "body", widget: "markdown", required: false }

  - name: "legal"
    label: "Rechtliches"
    files:
      - name: "impressum"
        label: "Impressum"
        file: "src/content/legal/de/impressum.md"
        fields:
          - { label: "Sprache", name: "lang", widget: "hidden", default: "de" }
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Zuletzt aktualisiert", name: "lastUpdated", widget: "datetime" }
          - { label: "Inhalt", name: "body", widget: "markdown" }
      - name: "datenschutz"
        label: "Datenschutz"
        file: "src/content/legal/de/datenschutz.md"
        fields:
          - { label: "Sprache", name: "lang", widget: "hidden", default: "de" }
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Zuletzt aktualisiert", name: "lastUpdated", widget: "datetime" }
          - { label: "Inhalt", name: "body", widget: "markdown" }
